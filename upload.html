<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Independence Day Memories</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #FF9933, white, #138808);
        text-align: center;
        padding: 20px;
    }
    h1 {
        color: #222;
    }
    .upload-box {
        background: white;
        padding: 15px;
        border-radius: 10px;
        max-width: 300px;
        margin: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    input, textarea, button {
        width: 90%;
        margin: 8px 0;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        background-color: #FF9933;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
    }
    button:hover {
        background-color: #cc7a29;
    }
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    .post {
        background: white;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .post img {
        width: 100%;
        border-radius: 8px;
    }
    a.back-link {
    display: inline-block;
    margin-top: 30px;
    text-decoration: none;
    color: #138808;
    font-weight: 600;
    border: 2px solid #138808;
    padding: 10px 18px;
    border-radius: 30px;
    transition: background-color 0.3s, color 0.3s;
  }
  a.back-link:hover {
    background-color: #138808;
    color: white;
  }
</style>
</head>
<body>

<h1>🇮🇳 Independence Day Memories 🇮🇳</h1>

<div class="upload-box">
    <input type="file" id="photoUpload" accept="image/*"><br />
    <textarea id="captionInput" placeholder="Write a caption..."></textarea><br />
    <button onclick="addPost()">Post Memory</button>
</div>

<div class="gallery" id="gallery">
    
  <a href="index.html" class="back-link">&larr; Back to Home</a>
</div>
    <!-- Example posts removed -->
</div>

<script>
function addPost() {
    const fileInput = document.getElementById('photoUpload');
    const captionText = document.getElementById('captionInput').value;
    const gallery = document.getElementById('gallery');

    if (fileInput.files.length === 0) {
        alert("Please select a photo!");
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const postDiv = document.createElement('div');
        postDiv.classList.add('post');

        const imgElement = document.createElement('img');
        imgElement.src = e.target.result;

        const caption = document.createElement('p');
        caption.textContent = captionText;

        postDiv.appendChild(imgElement);
        postDiv.appendChild(caption);

        gallery.prepend(postDiv);

        fileInput.value = '';
        document.getElementById('captionInput').value = '';
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
